services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: soc
      POSTGRES_PASSWORD: soc_password
      POSTGRES_DB: soc
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc -d soc"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://soc:soc_password@postgres:5432/soc
    ports: ["3000:3000"]
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node src/server.js"

volumes:
  pgdata: